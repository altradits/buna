default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "postgres") %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "yebente_buna_development") %>

test:
  <<: *default
  database: yebente_buna_test

production:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "yebente_buna_production") %>
  url: <%= ENV["DATABASE_URL"] %>
