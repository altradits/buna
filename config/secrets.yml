default: &default
  app_name: "Yebente Buna"
  amharic_name: "የበንቴ ቡና"
  merchant_phone: "+254707172370"
  admin_email: "yebente@gmail.com"
  support_phone: "+254707172370"
  base_currency: "KES"
  secondary_currency: "ETB"
  timezone: "Africa/Nairobi"
  mpesa:
    environment: <%= ENV.fetch("MPESA_ENVIRONMENT", "sandbox") %>
    consumer_key: <%= ENV.fetch("MPESA_CONSUMER_KEY", "sandbox_consumer_key") %>
    consumer_secret: <%= ENV.fetch("MPESA_CONSUMER_SECRET", "sandbox_consumer_secret") %>
    shortcode: <%= ENV.fetch("MPESA_SHORTCODE", "174379") %>
    passkey: <%= ENV.fetch("MPESA_PASSKEY", "bfb279f9aa9bdbcf158e97dd71a467cd2e0c893059b10f78e6b72ada1ed2c919") %>
    b2c_shortcode: <%= ENV.fetch("MPESA_B2C_SHORTCODE", "600000") %>
    initiator_name: <%= ENV.fetch("MPESA_INITIATOR_NAME", "testapi") %>
    callback_url: <%= ENV.fetch("MPESA_CALLBACK_URL", "https://yebente.africa/api/v1/mpesa/callback") %>
  logistics:
    origin_hub: "Addis Ababa Bole Central Fulfillment Hub"
    kenya_distribution_hub: "Nairobi Industrial Area Logistics Center"
    border_post: "Moyale One-Stop Border Post (OSBP) Customs Cleared"
    default_courier: "Fargo Courier East Africa"

development:
  <<: *default
  secret_key_base: <%= ENV.fetch("SECRET_KEY_BASE", "a"*128) %>

test:
  <<: *default
  secret_key_base: <%= ENV.fetch("SECRET_KEY_BASE", "b"*128) %>

production:
  <<: *default
  secret_key_base: <%= ENV.fetch("SECRET_KEY_BASE") { SecureRandom.hex(64) } %>
  merchant_phone: "+254707172370"
  admin_email: "yebente@gmail.com"
